[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "max-mcp"
version = "0.3.9"
description = "MCP server for Autodesk 3ds Max across releases, driven by a pure MAXScript bridge (no Python, PySide or pymxs inside Max)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["mcp>=1.2.0", "tomlkit>=0.13,<1", "tomli>=2; python_version < '3.11'"]

[project.scripts]
max-mcp = "max_mcp.server:main"
maxctl = "max_mcp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = ["ruff>=0.8,<1"]

[tool.ruff]
target-version = "py310"
extend-exclude = ["tools/docs", ".venv*", "tests/bench_py*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
