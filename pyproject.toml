[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "max-mcp"
version = "0.3.5"
description = "MCP server for Autodesk 3ds Max across releases, driven by a pure MAXScript bridge (no Python, PySide or pymxs inside Max)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["mcp>=1.2.0"]

[project.scripts]
max-mcp = "max_mcp.server:main"
maxctl = "max_mcp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
